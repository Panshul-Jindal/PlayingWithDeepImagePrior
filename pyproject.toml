[project]
name = "playingwithdeepimageprior"
version = "0.1.0"
description = "This assignment aims to play with deep image prior to get more understanding into the method and possibly addressing things which haven't been addressed till now"
readme = "README.md"
authors = [
    { name = "Panshul-Jindal", email = "panshul.jindal7@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cffi>=2.1.1",
    "cmake>=4.4.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "mkl>=2026.1.0",
    "nbstripout>=0.9.1",
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "setuptools>=84.0.0",
    "torch==2.10",
    "torchvision>=0.25.0",
]

[project.scripts]
playingwithdeepimageprior = "playingwithdeepimageprior:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
